<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>Yesterday's Portfolio</title>
	<defs>
		<filter id="glow" filterUnits="userSpaceOnUse" x="-32" y="-32" width="128" height="128">
			<feGaussianBlur stdDeviation="2.4" />
		</filter>
		<radialGradient id="bg" cx="50%" cy="45%" r="70%">
			<stop offset="0" stop-color="#132552" />
			<stop offset="1" stop-color="#070b18" />
		</radialGradient>
		<clipPath id="tile"><rect width="64" height="64" rx="14" /></clipPath>
	</defs>
	<rect width="64" height="64" rx="14" fill="url(#bg)" />
	<g clip-path="url(#tile)">
		<!-- the thread: a haze underneath, then the bright core -->
		<path d="M-4 36 C 12 30, 20 30, 28 33 S 44 38, 68 30" fill="none" stroke="#7fb1ff" stroke-width="7" stroke-linecap="round" opacity="0.55" filter="url(#glow)" />
		<path d="M-4 36 C 12 30, 20 30, 28 33 S 44 38, 68 30" fill="none" stroke="#ece7d8" stroke-width="3" stroke-linecap="round" />
		<!-- the traveller -->
		<circle cx="32" cy="34" r="8" fill="#9cc4ff" opacity="0.5" filter="url(#glow)" />
		<circle cx="32" cy="34" r="4.2" fill="#ffffff" />
	</g>
</svg>
