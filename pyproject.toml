[project]
name = "portfolio"
version = "0.1.0"
description = "Profile-driven CVaR portfolio optimisation with a time-travel backtest site"
requires-python = ">=3.12"
dependencies = [
    "ampl-module-base>=20260809",
    "ampl-module-highs>=20260813",
    "ampl-module-gurobi",
    "amplpy>=0.15",
    "numpy",
    "pandas",
    "pandas-datareader",
    "pyarrow",
    "quantstats",
    "requests",
    "yfinance",
]

[dependency-groups]
dev = [
    "ipykernel",
 "jupyter",
 "pypdf>=6.16.2",
 "pytest",
 "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "ampl"
url = "https://pypi.ampl.com"
explicit = true

[tool.uv.sources]
ampl-module-base = { index = "ampl" }
ampl-module-highs = { index = "ampl" }
ampl-module-gurobi = { index = "ampl" }
